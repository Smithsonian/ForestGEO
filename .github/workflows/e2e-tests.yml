name: E2E Tests

on:
  pull_request:
    branches: [main, forestgeo-app-development]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # E2E runs against a throwaway MySQL service container seeded by
    # tests/setup/e2e-seed.ts — never an external/Azure database. This keeps the
    # gate hermetic: no secrets, no firewall allow-lists, no shared-state flakes.
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Create .env for E2E testing
        run: |
          cat > frontend/.env <<'ENVEOF'
          AUTH_SECRET=e2e-ci-secret
          AUTH_URL=http://localhost:3000
          AZURE_SQL_USER=root
          AZURE_SQL_PASSWORD=testpassword
          AZURE_SQL_SERVER=127.0.0.1
          AZURE_SQL_PORT=3306
          AZURE_SQL_CATALOG_SCHEMA=catalog
          NEXT_PUBLIC_E2E_TESTING=true
          NODE_ENV=development
          PORT=3000
          ENVEOF

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Dependency-cycle gate
        run: node scripts/check-cycles.mjs
        working-directory: frontend

      - name: Any-escape count gate
        run: node scripts/check-any-count.mjs
        working-directory: frontend

      # The mysql service `--health-cmd` gates steps until MySQL is healthy, and
      # the seed's own connectWithRetry covers any residual TCP race.
      - name: Seed E2E database
        run: cd frontend && npm run db:seed:e2e
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testpassword

      - name: Install Cypress binary
        run: cd frontend && npx cypress install

      # Fail-closed guard for the accessibility gate. The spec list above referenced
      # `a11y-responsive.cy.ts` — a filename that never existed — so the a11y audit was
      # silently absent from the gate. This step fails the job if the REAL spec is gone
      # from disk (a rename must update the list) OR is no longer named in this workflow's
      # spec list, so a11y cannot be dropped from the gate again without a loud failure.
      - name: Assert accessibility spec is present and gated
        run: |
          A11Y_SPEC="cypress/e2e/accessibility-audit.cy.ts"
          WORKFLOW=".github/workflows/e2e-tests.yml"
          if [ ! -f "frontend/$A11Y_SPEC" ]; then
            echo "::error::Accessibility gate spec 'frontend/$A11Y_SPEC' not found on disk. If it was renamed, update the spec list in $WORKFLOW so the a11y audit stays gated."
            exit 1
          fi
          # Scope the reference check to the actual `spec:` list line, NOT the whole file:
          # $A11Y_SPEC also appears in this guard's own A11Y_SPEC= assignment above, so a
          # whole-file grep would stay green even if the spec were deleted from the gate's
          # spec: list — the exact regression this guard exists to catch. Keying off the
          # `spec:` line makes removal-from-list fail loudly.
          if ! grep -E '^[[:space:]]*spec:' "$WORKFLOW" | grep -qF "$A11Y_SPEC"; then
            echo "::error::Accessibility spec '$A11Y_SPEC' is not in the e2e 'spec:' list in $WORKFLOW. Re-add it so the a11y audit stays in the PR gate."
            exit 1
          fi
          echo "Accessibility gate spec present and gated: $A11Y_SPEC"

      - name: Run E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npx next dev --turbo
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          headed: false
          # census-creation drives the REAL app against the seeded MySQL service
          # (above). The remaining specs are self-contained: setupForestGEOUser
          # mocks the NextAuth session + site/plot/census + grid/error APIs via
          # cy.intercept, and their mock helpers are stateful (edits/clears mutate
          # the mock store), so they assert real UI behaviour without the DB.
          # The column-mapping/* specs are mock-driven too: they drive the real
          # upload UI via the e2e-upload-harness route and stub the upload pipeline
          # (sqlpacketload/setup*) with cy.intercept. The Tier B realdb anchor
          # (cypress/e2e/column-mapping-realdb/**) is intentionally NOT gated here
          # — it needs Docker MySQL and runs via `npm run test:e2e:realdb`.
          spec: cypress/e2e/census-creation.cy.ts,cypress/e2e/selection-persistence.cy.ts,cypress/e2e/validation-invalid-codes.cy.ts,cypress/e2e/data-viewing-comprehensive.cy.ts,cypress/e2e/cross-feature-integration.cy.ts,cypress/e2e/errors-explorer.cy.ts,cypress/e2e/accessibility-audit.cy.ts,cypress/e2e/column-mapping/csv-mapping-dialog.cy.ts,cypress/e2e/column-mapping/arcgis-preflight-mapping.cy.ts,cypress/e2e/column-mapping/mapping-signature-persistence.cy.ts,cypress/e2e/column-mapping/mapping-negative-paths.cy.ts
        env:
          NEXT_PUBLIC_E2E_TESTING: "true"

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Real-DB smoke gate.
  #
  # Drives the Tier B column-mapping realdb anchor through the GENUINE server
  # pipeline (browser Papa parse -> /api/sqlpacketload -> bulkingestionprocess ->
  # collapser) into coremeasurements, against the SAME throwaway MySQL service the
  # e2e-tests job uses — NO Azure secrets, no firewall allow-list, no shared state.
  # The realdb config (cypress.realdb.config.cjs) self-seeds `forestgeo_testing`
  # via its before() task (setupTestDatabase), so no db:seed:e2e step is needed.
  #
  # SPEC ASSIGNMENT — the upload-only real-DB anchor runs in PR smoke because its
  # dependencies are hermetic and its runtime is bounded:
  #   * csv-mapping-to-coremeasurements.cy.ts  -> PR SMOKE (this job).
  #       Upload-only: needs server-side auth() (satisfied by a real e2e JWT cookie +
  #       AUTH_SECRET + NEXT_PUBLIC_E2E_TESTING) plus local MySQL. No edit-apply, so it
  #       never touches AUTH_FUNCTIONS_POLL_URL. Runtime is bounded by its own DB polling
  #       budget (2 tests, POLL_RETRIES=60 * POLL_INTERVAL=2s worst case, but ingestion
  #       normally completes in a few polls) — comfortably inside this job's 20-min cap.
  # Nightly's default config excludes column-mapping-realdb/**, so this dedicated
  # job is the authoritative CI coverage for the real server/database path.
  # ---------------------------------------------------------------------------
  realdb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      # AZURE_SQL_* point the Next dev server at the LOCAL MySQL service (127.0.0.1) —
      # never Azure — so the realdb spec runs fully hermetically. AUTH_SECRET is a
      # throwaway CI value (NextAuth refuses to start without it, MissingSecret);
      # NEXT_PUBLIC_E2E_TESTING enables the e2e session bypass in auth.ts so a real JWT
      # cookie satisfies auth() without an external auth API.
      - name: Create .env for real-DB smoke
        run: |
          cat > frontend/.env <<'ENVEOF'
          AUTH_SECRET=e2e-ci-secret
          AUTH_URL=http://localhost:3000
          AZURE_SQL_USER=root
          AZURE_SQL_PASSWORD=testpassword
          AZURE_SQL_SERVER=127.0.0.1
          AZURE_SQL_PORT=3306
          AZURE_SQL_CATALOG_SCHEMA=catalog
          NEXT_PUBLIC_E2E_TESTING=true
          NODE_ENV=development
          PORT=3000
          ENVEOF

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Cypress binary
        run: cd frontend && npx cypress install

      # Fail-closed guard: a move/rename could leave the realdb glob matching nothing,
      # in which case cypress would exit 0 having run ZERO specs and the gate would pass
      # vacuously. Assert the directory holds specs AND the spec we gate exists first.
      - name: Assert real-DB specs are discoverable
        run: |
          REALDB_DIR="frontend/cypress/e2e/column-mapping-realdb"
          GATED_SPEC="$REALDB_DIR/csv-mapping-to-coremeasurements.cy.ts"
          count=$(find "$REALDB_DIR" -maxdepth 1 -name '*.cy.ts' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No real-DB specs found under $REALDB_DIR — the smoke gate would run zero specs. Refusing to pass vacuously."
            exit 1
          fi
          if [ ! -f "$GATED_SPEC" ]; then
            echo "::error::Gated real-DB spec '$GATED_SPEC' not found (renamed?). Update the spec input on this job."
            exit 1
          fi
          echo "Discovered $count real-DB spec file(s); gating $GATED_SPEC"

      # The mysql service health-cmd gates this step until MySQL is reachable; the realdb
      # config's before() task then self-seeds forestgeo_testing via setupTestDatabase.
      # TEST_DB_* reach the cypress-side DB tasks (seed/reset/query); AZURE_SQL_* reach the
      # dev server via frontend/.env. electron matches the local `npm run test:e2e:realdb`
      # invocation this job mirrors.
      - name: Run real-DB smoke (upload -> coremeasurements)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npx next dev --turbo
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: electron
          headed: false
          config-file: cypress.realdb.config.cjs
          spec: cypress/e2e/column-mapping-realdb/csv-mapping-to-coremeasurements.cy.ts
        env:
          NEXT_PUBLIC_E2E_TESTING: "true"
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testpassword

      - name: Upload real-DB smoke screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: realdb-smoke-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload real-DB smoke videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realdb-smoke-videos
          path: frontend/cypress/videos
          retention-days: 7
          if-no-files-found: ignore
