# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: ForestGEO Live Site Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel an in-progress production deploy

jobs:
  build-app-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: create env file (in frontend/ directory) -- production
        id: create-env-file-prod
        run: |
          touch frontend/.env
          echo AUTH_MICROSOFT_ENTRA_ID_SECRET=${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }} >> frontend/.env
          echo AUTH_MICROSOFT_ENTRA_ID_ID=${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ID }} >> frontend/.env
          echo AUTH_MICROSOFT_ENTRA_ID_ISSUER=${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ISSUER }} >> frontend/.env
          echo AUTH_SECRET=${{ secrets.AUTH_SECRET }} >> frontend/.env
          echo AUTH_URL=${{ secrets.AUTH_URL }} >> frontend/.env
          echo AUTH_FUNCTIONS_POLL_URL=${{ secrets.AUTH_FUNCTIONS_POLL_URL }} >> frontend/.env
          echo AZURE_SQL_USER=${{ secrets.AZURE_SQL_USER }} >> frontend/.env
          echo AZURE_SQL_PASSWORD=${{ secrets.AZURE_SQL_PASSWORD }} >> frontend/.env
          echo AZURE_SQL_SERVER=${{ secrets.AZURE_SQL_SERVER }} >> frontend/.env
          echo AZURE_SQL_DATABASE=${{ secrets.AZURE_SQL_DATABASE }} >> frontend/.env
          echo AZURE_SQL_PORT=${{ secrets.AZURE_SQL_PORT }} >> frontend/.env
          echo AZURE_STORAGE_SAS_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_SAS_CONNECTION_STRING }} >> frontend/.env
          echo AZURE_SQL_SCHEMA=${{ secrets.AZURE_SQL_SCHEMA }} >> frontend/.env
          echo AZURE_SQL_CATALOG_SCHEMA=${{ secrets.AZURE_SQL_CATALOG_SCHEMA }} >> frontend/.env
          echo AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }} >> frontend/.env
          echo APP_INSIGHTS_CONNECTION_STRING=${{ secrets.APP_INSIGHTS_CONNECTION_STRING }} >> frontend/.env
          echo NEXTAUTH_DEBUG=true >> frontend/.env
          echo NODE_ENV=production >> frontend/.env
          echo NEXT_RUNTIME=nodejs >> frontend/.env
          echo OTEL_LOG_LEVEL=debug >> frontend/.env
          echo REACT_EDITOR=code >> frontend/.env
          echo PORT=3000 >> frontend/.env
          echo NEXT_PUBLIC_E2E_TESTING=false >> frontend/.env
          echo FG_PAT=${{ secrets.FG_PAT }} >> frontend/.env
          echo OWNER=${{ secrets.OWNER }} >> frontend/.env
          echo REPO=${{ secrets.REPO }} >> frontend/.env

      - name: Install dependencies
        run: |
          cd frontend/
          npm install

      - name: Run unit tests
        run: |
          cd frontend/
          npm run test:unit:ci

      - name: Dependency-cycle gate
        run: node scripts/check-cycles.mjs
        working-directory: frontend

      - name: Any-escape count gate
        run: node scripts/check-any-count.mjs
        working-directory: frontend

      - name: Build application
        run: |
          cd frontend/
          NEXT_PUBLIC_E2E_TESTING=false npm run build

      - name: Move directories into build/standalone to reduce app load
        run: |
          mv ./frontend/build/static ./frontend/build/standalone/build
          # Merge public folder contents (standalone may already have a public dir with some assets)
          cp -r ./frontend/public/* ./frontend/build/standalone/public/
          # Copy .env file to standalone folder for runtime access to server-side env vars
          cp ./frontend/.env ./frontend/build/standalone/.env
          # Copy env loader script
          cp ./frontend/startup.js ./frontend/build/standalone/env-loader.js
          # Prepend env loader require to server.js
          echo "require('./env-loader.js');" | cat - ./frontend/build/standalone/server.js > ./frontend/build/standalone/server.js.tmp
          mv ./frontend/build/standalone/server.js.tmp ./frontend/build/standalone/server.js

      - name: Verify build integrity
        id: verify-build
        run: |
          cd frontend/build/standalone

          # Check BUILD_ID exists
          if [ ! -f "build/BUILD_ID" ]; then
            echo "::error::BUILD_ID file not found"
            exit 1
          fi
          BUILD_ID=$(cat build/BUILD_ID)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

          # Check build manifest exists
          if [ ! -f "build/build-manifest.json" ]; then
            echo "::error::build-manifest.json not found"
            exit 1
          fi
          echo "Build manifest present"

          # Check server chunks exist and count them
          CHUNK_COUNT=$(ls build/server/chunks/*.js 2>/dev/null | wc -l | tr -d '[:space:]')
          if [ "$CHUNK_COUNT" -lt 10 ]; then
            echo "::error::Insufficient server chunks found: $CHUNK_COUNT (expected 10+)"
            exit 1
          fi
          echo "chunk_count=$CHUNK_COUNT" >> $GITHUB_OUTPUT
          echo "Server chunks: $CHUNK_COUNT files"

          # Check static directory exists
          if [ ! -d "build/static" ]; then
            echo "::error::Static assets directory not found"
            exit 1
          fi
          echo "Static assets present"

          # Check server.js exists
          if [ ! -f "server.js" ]; then
            echo "::error::server.js not found"
            exit 1
          fi
          echo "server.js present"

          # Check public folder and animations exist
          if [ ! -d "public" ]; then
            echo "::error::public folder not found"
            exit 1
          fi
          echo "Public folder present"

          if [ ! -d "public/animations" ]; then
            echo "::error::animations folder not found in public"
            exit 1
          fi
          ANIMATION_COUNT=$(ls public/animations/*.lottie 2>/dev/null | wc -l | tr -d '[:space:]')
          if [ "$ANIMATION_COUNT" -lt 1 ]; then
            echo "::error::No animation files found in public/animations"
            exit 1
          fi
          echo "animation_count=$ANIMATION_COUNT" >> $GITHUB_OUTPUT
          echo "Animation files: $ANIMATION_COUNT .lottie files"

          # Check web.config for Azure configuration
          if [ -f "public/web.config" ]; then
            echo "web.config present (for Azure IIS compatibility)"
          fi

          # Check env-loader.js exists for env var loading
          if [ ! -f "env-loader.js" ]; then
            echo "::error::env-loader.js not found"
            exit 1
          fi
          echo "env-loader.js present"

          # Check .env file exists
          if [ ! -f ".env" ]; then
            echo "::error::.env file not found"
            exit 1
          fi
          echo ".env file present"

          echo "Build integrity verification passed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: frontend/build/standalone

  # Schema migrate + verify + stored-procedure/validation deploy.
  # This runs BEFORE the app deploy and the app deploy `needs:` it, so a failed
  # migration or a failed contract verify PREVENTS incompatible app code from
  # going live. The stored procedures reference the new columns, so they are
  # deployed only after the migration has added those columns.
  migrate-and-verify-production:
    needs: build-app-production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: |
          cd frontend/
          npm install --production=false

      # Shared `catalog` DDL runs ONCE per server and must land before the
      # per-site gate and before the app deploy, so code that reads
      # catalog.background_jobs can never ship ahead of those tables. The runner
      # fails closed on an incompatible existing table and never drops anything.
      - name: Apply catalog migrations (shared catalog database)
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          cd frontend/
          npx tsx scripts/apply-catalog-migrations.ts --azure --apply
        continue-on-error: false

      - name: Apply schema migrations to all schemas
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          cd frontend/
          npx tsx scripts/apply-schema-migrations.ts --all-sites --apply
        continue-on-error: false

      - name: Verify schema contract across all schemas
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          cd frontend/
          npx tsx scripts/check-schema-contract.ts --all-sites
        continue-on-error: false

      - name: Deploy validation queries and stored procedures to all schemas
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          cd frontend/
          npx tsx scripts/deploy-validations-to-all-schemas.ts
        continue-on-error: false

      # Views are CREATE OR REPLACE artifacts, not migrations: they are redeployed
      # from tablestructures.sql on every deploy, the same way procedures are. A site
      # provisioned by an older release of the app has no taxonomy views at all,
      # which makes the species viewer fail with "error fetching data".
      - name: Deploy taxonomy views to all schemas
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          cd frontend/
          npx tsx scripts/deploy-taxonomy-views-to-all-schemas.ts
        continue-on-error: false

  deploy-app-production:
    needs: [build-app-production, migrate-and-verify-production]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: frontend/build/standalone

      - name: 'Deploy to Azure Web App (main)'
        id: deploy-to-webapp-main
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'forestgeo-livesite'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PRODUCTION }}
          package: frontend/build/standalone

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for Azure to restart the app..."
          sleep 30
          echo "Deployment submitted to Azure App Service"
          # Note: External health checks are not performed because Azure Easy Auth
          # requires authentication. Build integrity was verified in the build job.

  # Failure-notification job for schema migration or app deployment failures.
  # An app restart is attempted only when app deployment itself failed.
  # Real rollback requires redeploying a previous good commit.
  rollback-on-failure:
    if: always() && (needs.migrate-and-verify-production.result == 'failure' || needs.deploy-app-production.result == 'failure')
    needs: [build-app-production, migrate-and-verify-production, deploy-app-production]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Azure Login
        if: needs.deploy-app-production.result == 'failure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true  # Gracefully handle missing credentials

      - name: Attempt app restart
        if: needs.deploy-app-production.result == 'failure'
        id: rollback
        run: |
          echo "Attempting to restart the app (will not fix code-level issues)..."

          az webapp restart --name forestgeo-livesite --resource-group ForestGEO-ResourceGroup || true

          echo "Waiting 60 seconds for app to restart..."
          sleep 60

          # Cannot verify health externally due to Azure Easy Auth
          echo "App restart attempted. Manual verification required (Azure Easy Auth blocks external health checks)."
          echo "rollback_status=requires_verification" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create failure issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const migrationFailed = '${{ needs.migrate-and-verify-production.result }}' === 'failure';
            const failureStage = migrationFailed ? 'schema migration/verification' : 'application deployment';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: migrationFailed
                ? 'URGENT: Production Schema Migration Failed - Manual Intervention Required'
                : 'URGENT: Production Deployment Failed - Manual Intervention Required',
              body: `## Production Pipeline Failure Alert

              **Time**: ${new Date().toISOString()}
              **Branch**: ${{ github.ref_name }}
              **Commit**: ${{ github.sha }}
              **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Failure Stage**: ${failureStage}
              **Migration Job**: ${{ needs.migrate-and-verify-production.result }}
              **Deployment Job**: ${{ needs.deploy-app-production.result }}

              ### What Happened
              The production ${failureStage} stage failed. An app restart is attempted only for an application-deployment failure; schema failures require reviewing the migration and ledger state.

              ### Recommended Actions
              1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              2. If migration failed, inspect each schema's \`schema_migrations\` ledger before retrying
              3. If deployment failed, check Azure Portal for app service status and logs
              4. Verify the app is running by logging in and testing functionality

              > **Note**: The health endpoint requires authentication (Azure Easy Auth) and cannot be checked externally.

              ### Manual Recovery
              \`\`\`bash
              # Revert the bad commit and push
              git revert <bad-commit-sha>
              git push origin main

              # Or restart the app (only helps with transient failures)
              az webapp restart -g ForestGEO-ResourceGroup -n forestgeo-livesite
              \`\`\`

              /cc @${{ github.actor }}`,
              labels: ['urgent', 'deployment-failure', 'production', 'automated']
            });
        continue-on-error: true
